name: Atualizar projetos recentes

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-projects
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos do perfil
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar cards SVG e atualizar README
        run: python scripts/update_projects.py

      - name: Publicar cards e README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/recent-projects/
          if ! git diff --cached --quiet; then
            git commit -m "docs: atualizar cards dos projetos recentes"
            git push
          else
            echo "Nenhuma alteracao necessaria."
          fi
